apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hotel-api:1.0
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_A
              value: "mongodb://mongo-a-0.mongo-a:27017,mongo-a-1.mongo-a:27017,mongo-a-2.mongo-a:27017/?replicaSet=rsA"
            - name: MONGO_B
              value: "mongodb://mongo-b-0.mongo-b:27017,mongo-b-1.mongo-b:27017,mongo-b-2.mongo-b:27017/?replicaSet=rsB"
            - name: REDIS
              value: "redis:6379"
            - name: CONSUL
              value: "http://consul:8500"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
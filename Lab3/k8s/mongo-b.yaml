apiVersion: v1
kind: Service
metadata:
  name: mongo-b
spec:
  clusterIP: None
  selector:
    app: mongo-b
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-b
spec:
  serviceName: mongo-b
  replicas: 3
  selector:
    matchLabels:
      app: mongo-b
  template:
    metadata:
      labels:
        app: mongo-b
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          command: ["mongod", "--replSet", "rsB", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
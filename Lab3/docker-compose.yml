services:
  mongo-a1:
    image: mongo:8.0
    container_name: mongo-a1
    ports:
      - "27017:27017"
    volumes:
      - mongo-a1-data:/data/db

  mongo-b1:
    image: mongo:8.0
    container_name: mongo-b1
    ports:
      - "27018:27017"
    volumes:
      - mongo-b1-data:/data/db

  redis:
    image: redis:7.4
    container_name: redis
    ports:
      - "6379:6379"

  consul:
    image: hashicorp/consul:1.20
    container_name: consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"


  test-api:
    build: ./Gateway/TestApi
    environment:
      - CONSUL=http://consul:8500
    depends_on:
      - consul
    deploy:
      replicas: 3
  gateway:
    build: ./Gateway/Gateway
    container_name: gateway
    ports:
      - "5000:8080"
    depends_on:
      - consul
      
volumes:
  mongo-a1-data:
  mongo-b1-data:
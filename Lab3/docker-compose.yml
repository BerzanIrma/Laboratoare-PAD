services:
  mongo-a1:
    image: mongo:8.0
    container_name: mongo-a1
    ports:
      - "27017:27017"
    volumes:
      - mongo-a1-data:/data/db

  mongo-b1:
    image: mongo:8.0
    container_name: mongo-b1
    ports:
      - "27018:27017"
    volumes:
      - mongo-b1-data:/data/db

  redis:
    image: redis:7.4
    container_name: redis
    ports:
      - "6379:6379"

  consul:
    image: hashicorp/consul:1.20
    container_name: consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  api-a:
    build: ./HotelApi
    environment:
      - API_GROUP=A
      - INSTANCE_NAME=api-a
      - MONGO_A=mongodb://mongo-a1:27017
      - MONGO_B=mongodb://mongo-b1:27017
      - REDIS=redis:6379
      - CONSUL=http://consul:8500
    depends_on:
      - mongo-a1
      - mongo-b1
      - redis
      - consul

  api-b:
    build: ./HotelApi
    environment:
      - API_GROUP=B
      - INSTANCE_NAME=api-b
      - MONGO_A=mongodb://mongo-a1:27017
      - MONGO_B=mongodb://mongo-b1:27017
      - REDIS=redis:6379
      - CONSUL=http://consul:8500
    depends_on:
      - mongo-a1
      - mongo-b1
      - redis
      - consul

  gateway:
    build: ./Gateway/Gateway
    container_name: gateway
    ports:
      - "5001:8080"
    depends_on:
      - consul

volumes:
  mongo-a1-data:
  mongo-b1-data: